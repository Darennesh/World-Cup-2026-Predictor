# 2026 FIFA World Cup format & structure
# 48 teams, 12 groups of 4. Advance: top 2 of each group + 8 best 3rd-placed
# teams -> Round of 32 -> R16 -> QF -> SF -> Final.
#
# NOTE: group membership below is a TEMPLATE. Replace `teams` lists with the
# actual draw once finalised, and fill `results` as 2026 group games are played.

format:
  n_teams: 48
  n_groups: 12
  teams_per_group: 4
  advance_per_group: 2
  best_third_advancing: 8
  knockout_rounds: [R32, R16, QF, SF, Final]

# Group standings tiebreakers, applied in order (FIFA regulations):
group_tiebreakers:
  - points
  - goal_difference
  - goals_for
  - head_to_head_points
  - head_to_head_goal_difference
  - head_to_head_goals_for
  - fair_play_points # fewer disciplinary points ranks higher
  - drawing_of_lots # random; resolve with a fixed seed in sim

host_cities:
  # city: [country, altitude_m, climate]
  Mexico City: [Mexico, 2240, hot_altitude]
  Guadalajara: [Mexico, 1566, hot_altitude]
  Monterrey: [Mexico, 540, hot_dry]
  Atlanta: [USA, 320, hot_humid]
  Dallas: [USA, 130, hot]
  Houston: [USA, 30, hot_humid]
  Kansas City: [USA, 270, temperate]
  Los Angeles: [USA, 90, mild]
  Miami: [USA, 2, hot_humid]
  New York: [USA, 10, temperate]
  Philadelphia: [USA, 12, temperate]
  San Francisco: [USA, 16, mild]
  Seattle: [USA, 50, mild]
  Boston: [USA, 40, temperate]
  Toronto: [Canada, 76, temperate]
  Vancouver: [Canada, 0, mild]

