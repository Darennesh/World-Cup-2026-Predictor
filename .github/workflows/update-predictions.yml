name: Update predictions

# Rebuilds the dashboard from the latest match data and commits the refreshed
# public/ site. Vercel (connected to this repo) auto-deploys on the resulting
# push, so the public dashboard stays current as the tournament progresses.

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch: {}        # allow manual runs from the Actions tab

permissions:
  contents: write              # needed to commit the regenerated site

concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site (refresh data + regenerate dashboard)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/build_site.py --sims 30000

      - name: Commit and push updated site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh predictions ($(date -u +%Y-%m-%dT%H:%MZ))"
          # Retry push with rebase to survive any concurrent pushes to main.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; rebasing on latest main and retrying..."
            git pull --rebase --autostash origin main || true
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
