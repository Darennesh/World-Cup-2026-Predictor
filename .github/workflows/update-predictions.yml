name: Update predictions

# Rebuilds the dashboard from the latest match data and commits the refreshed
# public/ site. Vercel (connected to this repo) auto-deploys on the resulting
# push, so the public dashboard stays current as the tournament progresses.

on:
  schedule:
    - cron: "0 6 * * *"      # daily at 06:00 UTC
  workflow_dispatch: {}        # allow manual runs from the Actions tab

permissions:
  contents: write              # needed to commit the regenerated site

concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site (refresh data + regenerate dashboard)
        run: python scripts/build_site.py --sims 30000

      - name: Commit updated site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh predictions ($(date -u +%Y-%m-%d))"
            git push
          fi
